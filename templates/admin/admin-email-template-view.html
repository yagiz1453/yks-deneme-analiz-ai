<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <title>{{ filename }} - Şablon Görüntüle</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
<div class="container mt-4">
    <h3>{{ filename }} İçeriği</h3>
    <a href="{{ url_for('admin.admin_email_templates') }}" class="btn btn-secondary mb-3">Şablon Listesine Dön</a>
    <pre class="form-control" style="background:#f8f9fa; border:1px solid #ddd; white-space:pre-wrap; min-height: 300px;">{{ content | e }}</pre>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Şifre Sıfırlama</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
    <div class="container mt-5" style="max-width:400px;">
        <h3 class="mb-4 text-center">Yeni Şifre Belirle</h3>
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}
        <form method="POST">
            <div class="mb-3">
                <label for="password" class="form-label">Yeni Şifre</label>
                <input type="password" class="form-control" id="password" name="password" required placeholder="Yeni şifrenizi girin" minlength="8">
                <div class="form-text text-muted" id="passwordHelp">
                  Şifreniz en az 8 karakter, bir büyük harf, bir küçük harf ve bir rakam içermelidir.
                </div>
            </div>
            <div class="mb-3">
                <label for="passwordConfirm" class="form-label">Yeni Şifre (Tekrar)</label>
                <input type="password" class="form-control" id="passwordConfirm" name="passwordConfirm" required placeholder="Yeni şifrenizi tekrar girin" minlength="8">
            </div>
            <button type="submit" class="btn btn-primary w-100">Şifreyi Sıfırla</button>
        </form>
        <div class="mt-3 text-center">
            <a href="/login">Girişe Dön</a>
        </div>
    </div>
    <script>
      // Şifre karmaşıklık ve eşleşme kontrolü (frontend)
      document.querySelector('form').addEventListener('submit', function(e) {
        const pass = document.getElementById('password').value;
        const passConfirm = document.getElementById('passwordConfirm').value;
        if (pass !== passConfirm) {
          e.preventDefault();
          alert('Şifreler uyuşmuyor!');
          return;
        }
        const strong = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$/;
        if (!strong.test(pass)) {
          e.preventDefault();
          alert('Şifreniz en az 8 karakter, bir büyük harf, bir küçük harf ve bir rakam içermelidir.');
          return;
        }
      });
    </script>
</body>
</html>

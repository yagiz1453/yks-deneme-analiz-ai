<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Giriş Yap - YKS Deneme Analiz</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet" />
  <style>
    body {
      background: #f8f9fc;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Nunito', sans-serif;
    }
    .login-container {
      background: white;
      padding: 2.5rem 3rem;
      border-radius: 0.5rem;
      box-shadow: 0 0.15rem 0.35rem rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }
    .form-control:focus {
      border-color: #4e73df;
      box-shadow: 0 0 0 0.25rem rgba(78,115,223,.25);
    }
    .btn-primary {
      background-color: #4e73df;
      border: none;
    }
    .btn-primary:hover {
      background-color: #2e59d9;
    }
    .alert-container {
      position: fixed;
      top: 20px;
      right: 20px;
      max-width: 350px;
      z-index: 1050;
    }
  </style>
</head>
<body>
  <!-- Flash mesajları -->
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="alert-container">
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  <div class="login-container">
    <h2 class="mb-4 text-center text-primary">Giriş Yap</h2>
    <form id="loginForm" method="POST" action="/login">
      <div class="mb-3">
        <label for="email" class="form-label">E-posta adresi</label>
        <input type="email" class="form-control" id="email" name="email" placeholder="example@mail.com" required />
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Şifre</label>
        <input type="password" class="form-control" id="password" name="password" placeholder="Şifrenizi girin" required />
      </div>
      <button type="submit" class="btn btn-primary w-100">Giriş Yap</button>
    </form>
    <div class="mt-3 text-center">
      Henüz hesabınız yok mu?
      <a href="/register" class="text-primary fw-semibold">Kayıt Ol</a>
    </div>
    <div class="mt-3 text-center">
      <a href="/forgot-password" class="text-secondary">Şifremi Unuttum?</a>
    </div>
    <div class="mt-3 text-center">
      <a href="/" class="text-secondary">Ana Sayfa</a>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Şifremi Unuttum</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
    <div class="container mt-5" style="max-width:400px;">
        <h3 class="mb-4 text-center">Şifremi Unuttum</h3>
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}
        <form method="POST">
            <div class="mb-3">
                <label for="email" class="form-label">E-posta adresiniz</label>
                <input type="email" class="form-control" id="email" name="email" required placeholder="E-posta adresinizi girin">
            </div>
            <button type="submit" class="btn btn-primary w-100">Sıfırlama Bağlantısı Gönder</button>
        </form>
        <div class="mt-3 text-center">
            <a href="/login">Girişe Dön</a>
        </div>
    </div>
</body>
</html>

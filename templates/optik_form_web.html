<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Optik Form ROI Seçimi</title>
    
    <!-- CSS Kütüphaneleri -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        :root {
            --primary-color: #4e73df;
            --secondary-color: #858796;
            --success-color: #1cc88a;
            --danger-color: #e74a3b;
            --warning-color: #f6c23e;
            --info-color: #36b9cc;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        canvas {
            border: 2px solid #fff;
            cursor: crosshair;
            display: block;
            margin: 20px auto;
            box-shadow: 0 0.5rem 2rem rgba(0, 0, 0, 0.3);
            border-radius: 0.5rem;
            background: white;
        }

        .control-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: 0 0.5rem 2rem rgba(0, 0, 0, 0.2);
            min-width: 300px;
            z-index: 1000;
        }

        .control-header {
            background: linear-gradient(135deg, var(--primary-color), #5a67d8);
            color: white;
            padding: 1rem;
            border-radius: 0.75rem;
            text-align: center;
            margin-bottom: 1rem;
            font-weight: 600;
        }

        .btn {
            border-radius: 0.5rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border: none;
            padding: 0.75rem 1.5rem;
            transition: all 0.3s;
        }

        .btn-success {
            background: linear-gradient(135deg, var(--success-color), #38a169);
            color: white;
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--danger-color), #e53e3e);
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
        }

        .status-card {
            background: linear-gradient(135deg, var(--info-color), #3182ce);
            color: white;
            padding: 1rem;
            border-radius: 0.75rem;
            margin-top: 1rem;
            text-align: center;
        }

        .status-message {
            font-size: 0.95rem;
            font-weight: 500;
        }

        .selection-info {
            background: rgba(28, 200, 138, 0.1);
            border: 2px solid var(--success-color);
            border-radius: 0.75rem;
            padding: 1rem;
            margin-top: 1rem;
            text-align: center;
        }

        .selection-coords {
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            color: #2c3e50;
            margin-top: 0.5rem;
        }

        .footer-info {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            font-size: 0.85rem;
            z-index: 1000;
        }

        .loading-indicator {
            display: none;
            text-align: center;
            padding: 1rem;
        }

        .spinner-border {
            width: 2rem;
            height: 2rem;
            color: var(--primary-color);
        }

        @media (max-width: 768px) {
            .control-panel {
                position: relative;
                top: 0;
                right: 0;
                margin: 10px;
                min-width: auto;
            }

            canvas {
                margin: 10px;
                max-width: calc(100vw - 20px);
                max-height: calc(100vh - 200px);
            }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div class="control-panel">
        <div class="control-header">
            <i class="bi bi-crosshair me-2"></i>Optik Form Seçimi
        </div>
        
        <div class="d-grid gap-2">
            <button id="submitBtn" class="btn btn-success">
                <i class="bi bi-check-circle me-2"></i>Seçimi Gönder
            </button>
            <button id="clearBtn" class="btn btn-danger">
                <i class="bi bi-trash me-2"></i>Seçimi Temizle
            </button>
        </div>

        <div class="status-card">
            <div class="status-message" id="status">
                <i class="bi bi-info-circle me-2"></i>Lütfen bir alan seçin
            </div>
        </div>

        <div id="selectionInfo" class="selection-info" style="display: none;">
            <div><strong>Seçim Yapıldı</strong></div>
            <div class="selection-coords" id="coords"></div>
        </div>

        <div id="loadingIndicator" class="loading-indicator">
            <div class="spinner-border" role="status">
                <span class="visually-hidden">Yükleniyor...</span>
            </div>
            <div class="mt-2">İşleniyor...</div>
        </div>
    </div>

    <div class="footer-info">
        <i class="bi bi-info-circle me-1"></i>v2.0 - Modern Optik Form Okuyucu
    </div>

    <script>
        // DOM Elements
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const submitBtn = document.getElementById('submitBtn');
        const clearBtn = document.getElementById('clearBtn');
        const statusDiv = document.getElementById('status');
        const selectionInfo = document.getElementById('selectionInfo');
        const coordsDiv = document.getElementById('coords');
        const loadingIndicator = document.getElementById('loadingIndicator');

        // State variables
        let image = new Image();
        let startX, startY, endX, endY, isDrawing = false;
        let selectedSubject = null;

        // Initialize from URL params
        const urlParams = new URLSearchParams(window.location.search);
        const imageUrl = urlParams.get('image');
        const defaultSubject = urlParams.get('ders') || 'Türkçe';

        // Available subjects
        const subjects = [
            'Türkçe',
            'Sosyal Bilimler',
            'Temel Matematik',
            'Fen Bilimleri'
        ];

        // Image loading
        image.onload = function() {
            // Scale canvas to fit window while maintaining aspect ratio
            const maxWidth = window.innerWidth * 0.7;
            const maxHeight = window.innerHeight * 0.8;
            const scale = Math.min(maxWidth / image.width, maxHeight / image.height, 1);

            canvas.width = image.width * scale;
            canvas.height = image.height * scale;

            // Store original dimensions for calculations
            canvas.dataset.originalWidth = image.width;
            canvas.dataset.originalHeight = image.height;

            ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
            updateStatus('Lütfen cevap alanını seçin', 'info');
        };

        image.onerror = function() {
            updateStatus('Görsel yüklenirken hata oluştu', 'danger');
        };

        image.src = imageUrl;

        // Event listeners
        canvas.addEventListener('mousedown', handleMouseDown);
        canvas.addEventListener('mousemove', handleMouseMove);
        canvas.addEventListener('mouseup', handleMouseUp);
        submitBtn.addEventListener('click', submitSelection);
        clearBtn.addEventListener('click', clearSelection);

        // Event handlers
        function handleMouseDown(e) {
            const rect = canvas.getBoundingClientRect();
            startX = e.clientX - rect.left;
            startY = e.clientY - rect.top;
            isDrawing = true;
            updateStatus('Alan seçiliyor...', 'warning');
        }

        function handleMouseMove(e) {
            if (!isDrawing) return;

            const rect = canvas.getBoundingClientRect();
            endX = e.clientX - rect.left;
            endY = e.clientY - rect.top;

            redrawCanvas();
            drawSelectionRectangle();
            updateSelectionInfo();
        }

        function handleMouseUp() {
            isDrawing = false;
            if (startX && endX) {
                updateStatus('Alan seçildi. Ders seçip gönderebilirsiniz', 'success');
                selectionInfo.style.display = 'block';
            }
        }

        async function submitSelection() {
            if (!startX || !endX) {
                updateStatus('Önce bir alan seçmelisiniz', 'danger');
                return;
            }

            // Calculate coordinates relative to original image size
            const scaleX = canvas.dataset.originalWidth / canvas.width;
            const scaleY = canvas.dataset.originalHeight / canvas.height;

            const x = Math.min(startX, endX) * scaleX;
            const y = Math.min(startY, endY) * scaleY;
            const w = Math.abs(endX - startX) * scaleX;
            const h = Math.abs(endY - startY) * scaleY;

            // Subject selection with modern prompt
            selectedSubject = prompt(
                "Bu bölge hangi ders?\n\n" + 
                subjects.map((s, i) => `${i + 1}. ${s}`).join('\n') + 
                "\n\nDers adını yazın:", 
                defaultSubject
            );

            if (!selectedSubject || !subjects.includes(selectedSubject)) {
                updateStatus('Geçersiz ders seçimi', 'danger');
                return;
            }

            await processSelection(x, y, w, h);
        }

        async function processSelection(x, y, w, h) {
            showLoading(true);
            updateStatus('İşleniyor...', 'info');

            try {
                const formData = new FormData();
                formData.append('x', Math.round(x));
                formData.append('y', Math.round(y));
                formData.append('w', Math.round(w));
                formData.append('h', Math.round(h));
                formData.append('image_url', imageUrl);
                formData.append('ders', selectedSubject);

                const response = await fetch('/optik-oku', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error(await response.text());
                }

                const data = await response.json();

                if (data.error) {
                    throw new Error(data.error);
                }

                sendResultsToParent(selectedSubject, data);

            } catch (error) {
                console.error('İşlem hatası:', error);
                updateStatus(`Hata: ${error.message}`, 'danger');
                showAlert(`İşlem hatası: ${error.message}`, 'danger');
            } finally {
                showLoading(false);
            }
        }

        function sendResultsToParent(subject, data) {
            if (!window.opener) {
                updateStatus('Ana pencere bulunamadı', 'danger');
                return;
            }

            window.opener.postMessage({
                type: 'ocrResults',
                results: {
                    [subject]: {
                        answers: data.answers,
                        stats: data.stats
                    }
                },
                isOptik: true
            }, '*');

            updateStatus('Başarıyla gönderildi!', 'success');
            showAlert('Veriler başarıyla gönderildi!', 'success');
            setTimeout(() => window.close(), 2000);
        }

        function clearSelection() {
            startX = startY = endX = endY = null;
            selectedSubject = null;
            selectionInfo.style.display = 'none';
            redrawCanvas();
            updateStatus('Seçim temizlendi', 'info');
        }

        // Drawing functions
        function redrawCanvas() {
            ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
        }

        function drawSelectionRectangle() {
            ctx.strokeStyle = '#1cc88a';
            ctx.lineWidth = 3;
            ctx.setLineDash([5, 5]);
            ctx.strokeRect(
                Math.min(startX, endX),
                Math.min(startY, endY),
                Math.abs(endX - startX),
                Math.abs(endY - startY)
            );
            ctx.setLineDash([]);
        }

        // Helper functions
        function updateStatus(message, type = 'info') {
            const icons = {
                info: 'bi-info-circle',
                success: 'bi-check-circle',
                warning: 'bi-exclamation-triangle',
                danger: 'bi-x-circle'
            };

            statusDiv.innerHTML = `<i class="${icons[type]} me-2"></i>${message}`;
        }

        function updateSelectionInfo() {
            if (startX && endX) {
                const width = Math.abs(endX - startX);
                const height = Math.abs(endY - startY);
                coordsDiv.textContent = `${width.toFixed(0)} x ${height.toFixed(0)} px`;
            }
        }

        function showLoading(show) {
            loadingIndicator.style.display = show ? 'block' : 'none';
            submitBtn.disabled = show;
            clearBtn.disabled = show;
        }

        function showAlert(message, type) {
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type} alert-dismissible fade show position-fixed`;
            alertDiv.style.cssText = 'top: 20px; left: 50%; transform: translateX(-50%); z-index: 2000; min-width: 300px;';
            alertDiv.innerHTML = `
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            document.body.appendChild(alertDiv);
            setTimeout(() => alertDiv.remove(), 3000);
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            if (image.complete) {
                const maxWidth = window.innerWidth * 0.7;
                const maxHeight = window.innerHeight * 0.8;
                const scale = Math.min(maxWidth / image.width, maxHeight / image.height, 1);

                canvas.width = image.width * scale;
                canvas.height = image.height * scale;

                redrawCanvas();
                if (startX && endX) {
                    drawSelectionRectangle();
                }
            }
        });
    </script>
</body>
</html>
